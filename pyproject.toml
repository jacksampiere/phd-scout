[project]
name = "phd_scout"
version = "0.1.0"
description = "Automated scouting for PhD opportunities via recurring email digests."
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
  "anthropic>=0.109.2",
  "beautifulsoup4>=4.15.0",
  "feedparser>=6.0.12",
  "python-dotenv>=1.0.0",
  "requests>=2.34.2",
]

[dependency-groups]
dev = [
  "ruff>=0.6.0",
  "pre-commit>=3.0.0",
  "pytest>=8.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
